<!DOCTYPE html>
<html>

<head>
    <title>Login - Alumni System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">Alumni System</a>

            <div>
                <a class="btn btn-outline-light btn-sm" href="index.html">Home</a>
                <a class="btn btn-outline-light btn-sm" href="register.html">Register</a>
            </div>

        </div>
    </nav>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="text-center mb-4">Login</h2>

                        <form>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Enter your password">
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Login
                            </button>

                        </form>

                        <p class="mt-3">
                            Don't have an account?
                            <a href="register.html">Register here</a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>Alumni Management System 2026</p>
    </footer>

</body>

</html>
